<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trale — unperishable · Drop 001</title>
<meta name="description" content="Trale. Beyond ordinary. Primer drop 2026: unperishable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#222;--card:#0e0e0e;--red:#e10e14;
--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:#000}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.logo{font-weight:900;letter-spacing:-.06em;font-size:1.7rem}
nav{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:.9rem;color:var(--mute)}
nav ul a:hover{color:#fff}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:800;border:0;border-radius:999px;padding:14px 28px;font:800 .95rem var(--sans);cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#ff1a21}
.btn.ghost{background:transparent;border:1.5px solid #fff}
.btn.ghost:hover{background:#fff;color:#000}
/* hero */
.hero{min-height:calc(100svh - 62px);display:flex;flex-direction:column;justify-content:center;padding:60px 0 40px;position:relative}
.hero small{color:var(--mute);font-weight:500;letter-spacing:.04em}
.hero h1{margin:.1em 0 0;font-weight:900;letter-spacing:-.065em;line-height:.9;font-size:clamp(6rem,34vw,28rem)}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(40%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero .script{font-family:var(--script);color:var(--red);font-size:clamp(1.8rem,5vw,3.6rem);margin:.1em 0 0 .3em;opacity:0;animation:fade 1.2s .9s forwards}
.hero-foot{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between;margin-top:56px}
.hero-foot p{max-width:430px;margin:0;color:#d6d6d6}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
/* countdown */
.count{display:flex;gap:18px}
.count div{text-align:center;min-width:54px}
.count b{display:block;font-size:2rem;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count i{font-style:normal;font-size:.75rem;color:var(--mute)}
.marquee{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:16px 0}
.marquee div{display:inline-block;animation:slide 28s linear infinite;font-weight:900;letter-spacing:-.04em;font-size:clamp(1.4rem,3vw,2.2rem)}
.marquee em{font-style:normal;color:var(--red);margin:0 .6em}
@keyframes slide{to{transform:translateX(-50%)}}
section{padding:clamp(70px,11vw,140px) 0}
h2{font-size:clamp(2.2rem,6vw,4.6rem);letter-spacing:-.055em;line-height:.95;margin:0 0 .5em;font-weight:900}
.lead{color:var(--mute);max-width:520px;margin:0 0 48px}
/* catalog */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.art{background:#161616;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.art svg{width:78%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .art svg{transform:scale(1.06) rotate(-1deg)}
.info{padding:26px;display:flex;flex-direction:column;gap:16px;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h3{margin:0;font-size:1.5rem;letter-spacing:-.04em;font-weight:900}
.price b{font-size:1.4rem;font-weight:900}
.price s{color:var(--mute);margin-left:8px;font-size:.95rem}
.info p{margin:0;color:var(--mute);font-size:.95rem}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{background:none;color:#fff;border:1px solid #3a3a3a;border-radius:4px;min-width:46px;padding:9px 12px;font:500 .9rem var(--sans);cursor:pointer;transition:.15s}
.sizes button:hover{border-color:#fff}
.sizes button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.stock{font-size:.85rem;color:#ddd}
.bar{height:4px;background:#222;border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width 1.4s .2s cubic-bezier(.2,.8,.2,1)}
.info .btn{text-align:center;margin-top:auto}
.hint{font-size:.8rem;color:var(--red);min-height:1.2em;margin:-6px 0 0}
/* brand */
.brand{border-top:1px solid var(--line)}
.brand .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:50px;align-items:start}
.quote{font-size:clamp(1.4rem,2.6vw,2rem);letter-spacing:-.035em;line-height:1.25;font-weight:500;margin:0}
.quote em{font-family:var(--script);font-style:normal;color:var(--red);font-size:1.25em}
.facts{display:grid;gap:0}
.facts div{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.facts span{color:var(--mute)}
.facts b{font-weight:500;text-align:right}
/* club */
.club{background:var(--red);color:#000}
.club h2{color:#000}
.club p{max-width:560px;font-weight:500;font-size:1.1rem;margin:0 0 30px}
.club .btn{background:#000}
.club .btn:hover{background:#fff;color:#000}
/* contact */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;border-top:1px solid var(--line)}
.links a{padding:30px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:padding .25s,color .25s}
.links a:hover{color:var(--red);padding-left:12px}
.links span{color:var(--mute);font-size:.85rem}
.links b{font-size:1.4rem;letter-spacing:-.03em}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.card[hidden]{display:none}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chips button{background:none;color:#fff;border:1px solid #3a3a3a;border-radius:999px;padding:8px 18px;font:500 .9rem var(--sans);cursor:pointer}
.chips button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.dropbar{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:center;justify-content:space-between;border-block:1px solid var(--line);padding:16px 0;margin-bottom:26px;color:var(--mute)}
.dropbar .count b{font-size:1.4rem}
.lbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.shot{margin:0}
.shot:nth-child(3n+2){margin-top:44px}
.shot img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:4px;background:#111}
.shot img{cursor:zoom-in}
.ph{display:grid;place-items:center;border:1px dashed #333;color:#555;font-size:.85rem}
.shot figcaption{color:var(--mute);font-size:.85rem;padding-top:8px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%}
@media(max-width:640px){.lbgrid{grid-template-columns:repeat(2,1fr)}.shot:nth-child(3n+2){margin-top:0}}
.r{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.r.in{opacity:1;transform:none}
@media(max-width:640px){nav ul{display:none}.count b{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 span,.hero .script,.r{opacity:1;transform:none}.marquee div{transform:none}}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="logo" href="#top" id="navLogo">trale</a>
  <ul><li><a href="#catalogo">Catálogo</a></li><li><a href="#lookbook">Lookbook</a></li><li><a href="#marca">La marca</a></li><li><a href="#contacto">Contacto</a></li></ul>
  <a class="btn" href="#catalogo" style="padding:10px 20px">Ver catálogo</a>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <small id="heroMeta"></small>
  <h1 aria-label="unperishable" id="heroTitle"></h1>
  <p class="script" id="heroTag"></p>
  <div class="hero-foot">
    <p id="heroText"></p>
    <a class="btn" href="#catalogo">Ver catálogo</a>
  </div>
</div></header>

<div class="marquee" aria-hidden="true"><div id="marq"></div></div>

<section id="catalogo"><div class="wrap">
  <h2 class="r" id="catTitle"></h2>
  <p class="lead r" id="catLead"></p>
  <div class="chips" id="chips"></div>
  <div class="dropbar"><span id="dropLabel"></span><div class="count" id="count"></div></div>
  <div class="grid" id="grid"></div>
</div></section>

<section id="lookbook"><div class="wrap">
  <h2 class="r" id="lbTitle"></h2>
  <p class="lead r" id="lbLead"></p>
  <div class="lbgrid" id="lbGrid"></div>
</div></section>
<div class="lb" id="lb" hidden></div>

<section class="brand" id="marca"><div class="wrap cols">
  <div class="r">
    <h2 id="brandTitle"></h2>
    <p class="quote" id="brandText"></p>
  </div>
  <div class="facts r" id="facts"></div>
</div></section>

<section class="club" id="club"><div class="wrap">
  <h2 class="r" id="clubTitle"></h2>
  <p class="r" id="clubText"></p>
  <a class="btn r" id="clubBtn" target="_blank" rel="noopener"></a>
</div></section>

<section id="contacto"><div class="wrap">
  <h2 class="r" id="ctTitle"></h2>
  <p class="lead r" id="ctLead"></p>
  <div class="links r" id="links"></div>
</div></section>

<footer><div class="wrap"><span id="foot1"></span><span id="foot2"></span></div></footer>

<script>
/* =========================================================
   EDITA AQUÍ: todo el contenido de la página vive en CONFIG.
   ========================================================= */
const CONFIG = {
  brand: "trale",
  tagline: "beyond ordinary",
  whatsapp: "5219610000000",          // número con lada, sin + ni espacios
  instagram: "https://instagram.com/trale",
  instagramUser: "@trale",
  email: "hola@trale.mx",
  currency: "MXN",
  dropEnds: "2026-12-31T23:59:00",    // fecha real de cierre del drop
  dropLabel: "Drop 001 cierra en",   // texto junto a la cuenta regresiva
  hero: {
    title: "trale",
    script: "beyond ordinary",
    text: "Ropa hecha para quedarse. Cortes oversized, algodón que mejora con el uso y diseños que dicen algo. Cada drop es una tirada limitada."
  },
  marquee: ["beyond ordinary", "más allá de lo ordinario", "algo no caduca", "trale"],
  catalog: {
    title: "Catálogo.",
    lead: "Tiradas limitadas por drop. Cuando se acaban, no vuelven."
  },
  /* FOTOS DE MODELOS: pon la ruta en src (ej. "img/modelo1.jpg"). Agrega o quita bloques libremente. */
  lookbook: {
    title: "Lookbook.",
    lead: "Trale en la calle, de noche y a plena luz.",
    photos: [
      { src: "", alt: "Modelo con playera unperishable", caption: "unperishable tee · Drop 001" },
      { src: "", alt: "Modelo con playera unperishable", caption: "unperishable tee · Drop 001" },
      { src: "", alt: "Modelo con playera unperishable", caption: "unperishable tee · Drop 001" },
      { src: "", alt: "Modelo con playera trale", caption: "trale chest tee · Drop 001" },
      { src: "", alt: "Modelo con playera trale", caption: "trale chest tee · Drop 001" },
      { src: "", alt: "Modelo trale", caption: "trale" }
    ]
  },
  /* stock = piezas que realmente quedan · total = tirada inicial (mantenlos reales) */
  products: [
    /* drop = colección · img = ruta de foto del producto (si va vacío se usa el dibujo) */
    { name: "unperishable tee", drop: "Drop 001", img: "", art: "back",
      desc: "Oversized fit. Estampado trasero rojo: unperishable — you are my true soul.",
      price: 599, compareAt: 749, stock: 14, total: 40, sizes: ["S","M","L","XL"] },
    { name: "trale chest tee", drop: "Drop 001", img: "", art: "chest",
      desc: "Oversized fit. Estampado pequeño en pecho, trale repetido en rojo.",
      price: 549, compareAt: 699, stock: 22, total: 40, sizes: ["S","M","L","XL"] }
  ],
  brandSection: {
    title: "Más allá de lo ordinario.",
    text: "trale nace para recordar que lo verdadero no caduca. Ropa hecha para quedarse: cortes oversized, algodón que mejora con el uso y diseños que dicen algo."
  },
  facts: [
    ["Material", "100% Sea Island cotton"],
    ["Corte", "Oversized fit"],
    ["Hecho en", "México"],
    ["Cuidado", "Lavar a 30 °C · No blanquear · Planchar a baja temperatura"],
    ["Tirada", "Limitada, numerada por drop"]
  ],
  club: {
    title: "Repostea. Recibe una sorpresa.",
    text: "Comparte nuestro último drop en tus historias y etiquétanos. Te mandamos el diseño exclusivo y una sorpresa por DM.",
    button: "Abrir Instagram"
  },
  contact: {
    title: "Hablemos.",
    lead: "Pedidos, tallas, envíos o colaboraciones. Respondemos el mismo día."
  },
  buyText: "Hola trale, quiero pedir: {producto}, talla {talla}."
};

/* ============ lógica (no necesitas tocar esto) ============ */
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:CONFIG.currency,maximumFractionDigits:0}).format(n);
const C = CONFIG;

$("heroMeta").textContent = C.brand + " · más allá de lo ordinario · 2026";
$("heroTitle").innerHTML = [...C.hero.title].map((ch,i)=>`<span style="animation-delay:${i*45}ms">${ch}</span>`).join("");
$("heroTag").textContent = C.hero.script;
$("heroText").textContent = C.hero.text;
$("marq").innerHTML = (C.marquee.concat(C.marquee).map(t=>t+'<em>●</em>').join(""));
$("catTitle").textContent = C.catalog.title;
$("catLead").textContent = C.catalog.lead;
$("brandTitle").textContent = C.brandSection.title;
$("brandText").innerHTML = C.brandSection.text.replace(/lo verdadero no caduca/i, m=>m+"") ;
$("facts").innerHTML = C.facts.map(f=>`<div><span>${f[0]}</span><b>${f[1]}</b></div>`).join("");
$("clubTitle").textContent = C.club.title;
$("clubText").textContent = C.club.text;
$("clubBtn").textContent = C.club.button; $("clubBtn").href = C.instagram;
$("ctTitle").textContent = C.contact.title;
$("ctLead").textContent = C.contact.lead;
$("links").innerHTML = `
  <a href="https://wa.me/${C.whatsapp}" target="_blank" rel="noopener"><span>WhatsApp</span><b>Escríbenos</b></a>
  <a href="${C.instagram}" target="_blank" rel="noopener"><span>Instagram</span><b>${C.instagramUser}</b></a>
  <a href="mailto:${C.email}"><span>Correo</span><b>${C.email}</b></a>`;
$("foot1").textContent = "© 2026 " + C.brand + " — " + C.tagline;
$("foot2").textContent = "Hecho en México";

/* playeras dibujadas en SVG (sustituye por fotos si quieres: ver nota) */
const TEE = "M95 30 L60 45 L10 95 L45 125 L75 105 L75 300 L225 300 L225 105 L255 125 L290 95 L240 45 L205 30 Q150 58 95 30 Z";
function tee(kind){
  const print = kind==="back"
   ? `<text x="150" y="150" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.6" fill="#e10e14">unperishable</text>
      <text x="150" y="171" text-anchor="middle" font-family="'Pinyon Script',cursive" font-size="15" fill="#e10e14">you are my true soul</text>
      <text x="80" y="165" font-family="Inter,sans-serif" font-size="5.5" font-weight="800" fill="#e10e14">2026</text>
      <text x="220" y="165" text-anchor="end" font-family="Inter,sans-serif" font-size="5.5" font-weight="800" fill="#e10e14">TRALE</text>`
   : [0,1,2].map(r=>`<text x="168" y="${88+r*10}" font-family="Inter,sans-serif" font-weight="800" font-size="8" letter-spacing="-.4" fill="#e10e14">trale  trale  trale</text>`).join("");
  return `<svg viewBox="0 0 300 330" role="img" aria-label="Playera ${kind==='back'?'unperishable':'trale'}"><path d="${TEE}" fill="#050505" stroke="#333" stroke-width="1.5"/><path d="M95 30 Q150 58 205 30" fill="none" stroke="#2a2a2a" stroke-width="3"/>${print}</svg>`;
}

/* catálogo */
const state = {};
$("grid").innerHTML = C.products.map((p,i)=>{
  const left = Math.max(0,Math.min(100,Math.round(100*(1-p.stock/p.total))));
  const low = p.stock<=10 ? "Últimas piezas: " : "";
  return `<article class="card r" data-drop="${p.drop}">
    <div class="art">${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy">`:tee(p.art)}</div>
    <div class="info">
      <div class="top"><h3>${p.name}</h3><div class="price"><b>${money(p.price)}</b>${p.compareAt?`<s>${money(p.compareAt)}</s>`:""}</div></div>
      <p>${p.desc}</p>
      <div class="sizes" role="group" aria-label="Talla">${p.sizes.map(s=>`<button type="button" aria-pressed="false" data-i="${i}" data-s="${s}">${s}</button>`).join("")}</div>
      <div class="stock">${low}quedan ${p.stock} de ${p.total}<div class="bar"><i data-w="${left}"></i></div></div>
      <p class="hint" id="hint${i}"></p>
      <a class="btn" href="#" data-buy="${i}">Pedir por WhatsApp</a>
    </div></article>`;
}).join("");

document.addEventListener("click",e=>{
  const sb = e.target.closest(".sizes button");
  if(sb){
    const i = sb.dataset.i; state[i] = sb.dataset.s;
    sb.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===sb));
    $("hint"+i).textContent = "";
  }
  const buy = e.target.closest("[data-buy]");
  if(buy){
    e.preventDefault();
    const i = buy.dataset.buy, p = C.products[i];
    if(!state[i]){ $("hint"+i).textContent = "Elige tu talla para continuar."; return; }
    const msg = C.buyText.replace("{producto}",p.name).replace("{talla}",state[i]);
    window.open("https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(msg),"_blank","noopener");
  }
});

/* cuenta regresiva */
function tick(){
  const d = new Date(C.dropEnds) - Date.now();
  const box = $("count");
  if(isNaN(d) || d<=0){ box.innerHTML = '<div style="min-width:0"><b style="font-size:1.1rem">Drop cerrado</b></div>'; return; }
  const v = [["días",86400000],["hrs",3600000],["min",60000],["seg",1000]];
  let r = d;
  box.innerHTML = v.map(([l,ms])=>{const n=Math.floor(r/ms); r-=n*ms; return `<div><b>${String(n).padStart(2,"0")}</b><i>${l}</i></div>`}).join("");
}
tick(); setInterval(tick,1000);

/* filtros por drop */
$("dropLabel").textContent = C.dropLabel;
const drops = [...new Set(C.products.map(p=>p.drop))];
$("chips").innerHTML = ["Todo",...drops].map((d,i)=>`<button type="button" aria-pressed="${i===0}" data-f="${d}">${d}</button>`).join("");
$("chips").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  $("chips").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.querySelectorAll(".card").forEach(c=>c.hidden = b.dataset.f!=="Todo" && c.dataset.drop!==b.dataset.f);
});

/* lookbook + visor */
$("lbTitle").textContent = C.lookbook.title;
$("lbLead").textContent = C.lookbook.lead;
$("lbGrid").innerHTML = C.lookbook.photos.map(f=>`<figure class="shot r">${f.src?`<img src="${f.src}" alt="${f.alt||""}" loading="lazy">`:`<div class="ph"><span>Tu foto aquí</span></div>`}<figcaption>${f.caption||""}</figcaption></figure>`).join("");
document.addEventListener("click",e=>{
  const im = e.target.closest(".shot img");
  if(im){ $("lb").innerHTML = `<img src="${im.src}" alt="${im.alt}">`; $("lb").hidden = false; }
  else if(e.target.closest("#lb")) $("lb").hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("lb").hidden = true; });

/* revelado al hacer scroll + barras de stock */
const io = new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return;
  en.target.classList.add("in");
  en.target.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%");
  io.unobserve(en.target);
}),{threshold:.15});
document.querySelectorAll(".r").forEach(el=>io.observe(el));
</script>
</body>
</html>
